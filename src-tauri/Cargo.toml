[package]
name = "image_viewer"
version = "0.1.0"
description = "A fast, simple image viewer"
authors = ["Avirup Basu"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "image_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Decode + resize for the thumb:// protocol. Only the formats we list in EXTS.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# EXIF metadata for the info panel (crate is published as kamadak-exif, imported as `exif`)
kamadak-exif = "0.6"
# Move files to the OS Trash / Recycle Bin instead of deleting them
trash = "5"
# Decode the %2F-encoded path in thumb:// URLs
percent-encoding = "2"
# Semaphore to cap how many thumbnails are generated at once
tokio = { version = "1", features = ["sync"] }

# Image decoding is very slow in unoptimized debug builds. Optimize just the
# dependencies so `tauri dev` thumbnails are usable, while your own crate still
# compiles quickly.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3242"/>
      <stop offset="1" stop-color="#14171D"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EBBFF"/>
      <stop offset="1" stop-color="#5B9BFF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="photo"><rect x="292" y="330" width="440" height="330" rx="22"/></clipPath>
  </defs>

  <!-- squircle tile: 824px with 100px transparent margin (macOS grid) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <!-- back photo card, tilted -->
  <g transform="rotate(-9 512 500)" filter="url(#cardShadow)">
    <rect x="266" y="300" width="492" height="382" rx="34" fill="#C9CCD1"/>
    <rect x="292" y="326" width="440" height="330" rx="22" fill="#5E6B80"/>
  </g>

  <!-- front photo card -->
  <g transform="rotate(4 512 520)" filter="url(#cardShadow)">
    <rect x="266" y="304" width="492" height="452" rx="34" fill="#F4F5F7"/>
    <g clip-path="url(#photo)">
      <rect x="292" y="330" width="440" height="330" fill="url(#sky)"/>
      <circle cx="628" cy="420" r="44" fill="#FFD68A"/>
      <path d="M292 590 L400 470 L478 548 L560 452 L732 610 L732 660 L292 660 Z" fill="#2F5FD0"/>
      <path d="M292 620 L392 560 L480 612 L590 548 L732 630 L732 660 L292 660 Z" fill="#1C3B85"/>
    </g>
  </g>
</svg>
